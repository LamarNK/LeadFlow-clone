server {
    listen 80;
    listen [::]:80;
    server_name orbitsu.ru www.orbitsu.ru api.orbitsu.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8444 ssl http2;
    listen [::]:8444 ssl http2;
    server_name orbitsu.ru www.orbitsu.ru;
    ssl_certificate /etc/letsencrypt/live/orbitsu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbitsu.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 512m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }
}
server {
    listen 8445 ssl http2;
    listen [::]:8445 ssl http2;
    server_name api.orbitsu.ru;
    ssl_certificate /etc/letsencrypt/live/api.orbitsu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orbitsu.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 512m;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }
}