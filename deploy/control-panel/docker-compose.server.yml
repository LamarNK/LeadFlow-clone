# Orbita Server Compose (for VPS at 163.5.153.207)
# Run from /opt/orbita on the server:
#   docker compose -f docker-compose.server.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbita
      POSTGRES_USER: orbita
      POSTGRES_PASSWORD: orbita
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbita_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbita -d orbita"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src
      dockerfile: deploy/control-panel/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=orbita;Username=orbita;Password=orbita
      RegistrationSecret: ${REGISTRATION_SECRET}
      Jwt__Key: ${JWT_KEY}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Cors__Origins__0: ${CORS_ORIGIN_0:-http://163.5.153.207}
      Cors__Origins__1: ${CORS_ORIGIN_1:-http://localhost}
      Logs__SharedRoot: /app/Data/logs
      DataProtection__KeysPath: /app/Data/dataprotection-api
      CrmCallRecordings__DataPath: /app/Data/crm/call-recordings
      CrmSuccessDocuments__DataPath: /app/Data/crm/success-documents
      CrmSipRuntime__ConfigPath: /app/Data/telephony-runtime
      BitrixWorkforce__PublicBaseUrl: ${BITRIX_WORKFORCE_PUBLIC_BASE_URL:-https://api.orbitsu.ru}
      BitrixWorkforce__WorkerIntervalSeconds: ${BITRIX_WORKFORCE_WORKER_INTERVAL_SECONDS:-5}
      BitrixWorkforce__BatchSize: ${BITRIX_WORKFORCE_BATCH_SIZE:-50}
      BitrixWorkforce__LeaseSeconds: ${BITRIX_WORKFORCE_LEASE_SECONDS:-300}
      TelephonyGateway__PublicBaseUrl: ${TELEPHONY_GATEWAY_PUBLIC_BASE_URL:-}
      TelephonyWebRtc__Enabled: ${TELEPHONY_WEBRTC_ENABLED:-false}
      TelephonyWebRtc__WebSocketUrl: ${TELEPHONY_WEBRTC_WS_URL:-}
      TelephonyWebRtc__SipDomain: ${TELEPHONY_WEBRTC_SIP_DOMAIN:-}
      TelephonyWebRtc__IceServerUrls: ${TELEPHONY_WEBRTC_ICE_SERVER_URLS:-stun:stun.l.google.com:19302}
      TelephonyWebRtc__IceUsername: ${TELEPHONY_WEBRTC_ICE_USERNAME:-}
      TelephonyWebRtc__IceCredential: ${TELEPHONY_WEBRTC_ICE_CREDENTIAL:-}
      TelephonyWebRtc__IceAuthSecret: ${COTURN_AUTH_SECRET:-}
      TelephonyWebRtc__IceCredentialTtlSeconds: ${TELEPHONY_WEBRTC_ICE_CREDENTIAL_TTL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - orbita_logs:/app/Data/logs
      - orbita_releases:/app/Data/releases
      - orbita_diagnostics:/app/Data/diagnostics
      - orbita_dataprotection_api:/app/Data/dataprotection-api
      - orbita_crm_call_recordings:/app/Data/crm/call-recordings
      - orbita_crm_success_documents:/app/Data/crm/success-documents
      - orbita_telephony_runtime:/app/Data/telephony-runtime

  web:
    build:
      context: ./src
      dockerfile: deploy/control-panel/Dockerfile.web
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      OrbitaApi__BaseUrl: http://api:8080
      Jwt__Key: ${JWT_KEY}
      DataProtection__KeysPath: /app/Data/dataprotection
      Logs__SharedRoot: /app/Data/logs
    depends_on:
      - api
    ports:
      - "80:8080"
    volumes:
      - orbita_dataprotection:/app/Data/dataprotection
      - orbita_logs:/app/Data/logs

  telephony-gateway:
    profiles: ["telephony", "telephony-media"]
    build:
      context: ./src
      dockerfile: deploy/control-panel/Dockerfile.telephony-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      TelephonyGateway__OrbitaApiBaseUrl: http://api:8080
      TelephonyGateway__QueuePath: /app/Data/queue
      TelephonyGateway__QueueEncryptionKey: ${TELEPHONY_GATEWAY_QUEUE_KEY:-}
      TelephonyGateway__MaxQueueItems: ${TELEPHONY_GATEWAY_MAX_QUEUE_ITEMS:-100000}
      TelephonyGateway__MaxQueueBytes: ${TELEPHONY_GATEWAY_MAX_QUEUE_BYTES:-10737418240}
      TelephonyGateway__MaxBodyBytes: ${TELEPHONY_GATEWAY_MAX_BODY_BYTES:-110100480}
      TelephonyGateway__MaxDeliveryAttempts: ${TELEPHONY_GATEWAY_MAX_DELIVERY_ATTEMPTS:-20}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - orbita_telephony_queue:/app/Data/queue

  asterisk:
    profiles: ["telephony-media"]
    build:
      context: ./src
      dockerfile: deploy/control-panel/Dockerfile.asterisk
    restart: unless-stopped
    environment:
      ASTERISK_EXTERNAL_ADDRESS: ${ASTERISK_EXTERNAL_ADDRESS:-}
      ASTERISK_LOCAL_NET: ${ASTERISK_LOCAL_NET:-172.16.0.0/12}
      ASTERISK_SIP_SERVER: ${ASTERISK_SIP_SERVER:-}
      ASTERISK_SIP_PORT: ${ASTERISK_SIP_PORT:-5060}
      ASTERISK_SIP_TRANSPORT: ${ASTERISK_SIP_TRANSPORT:-tcp}
      ASTERISK_SIP_LOGIN: ${ASTERISK_SIP_LOGIN:-}
      ASTERISK_SIP_AUTH_LOGIN: ${ASTERISK_SIP_AUTH_LOGIN:-}
      ASTERISK_SIP_PASSWORD: ${ASTERISK_SIP_PASSWORD:-}
      # Keep false when all provider lines are configured in Orbita settings.
      # The optional static trunk is only for a separate legacy provider.
      ASTERISK_PRIMARY_TRUNK_ENABLED: ${ASTERISK_PRIMARY_TRUNK_ENABLED:-false}
      ASTERISK_DEFAULT_EXTENSION: ${ASTERISK_DEFAULT_EXTENSION:-}
      ASTERISK_PUBLIC_ID: ${ASTERISK_PUBLIC_ID:-}
      ASTERISK_WEBHOOK_SECRET: ${ASTERISK_WEBHOOK_SECRET:-}
      ASTERISK_WEBRTC_ENABLED: ${TELEPHONY_WEBRTC_ENABLED:-false}
      # Fallback for the legacy/default trunk. Dynamic trunks and receivers are
      # isolated by office in the shared runtime volume.
      ASTERISK_DEFAULT_OFFICE_ID: ${ASTERISK_DEFAULT_OFFICE_ID:-}
      ASTERISK_OFFICE_ID: ${ASTERISK_OFFICE_ID:-}
      ASTERISK_RUNTIME_CONFIG_DIR: /var/lib/orbita/telephony-runtime
      TELEPHONY_GATEWAY_INTERNAL_URL: http://telephony-gateway:8080
    depends_on:
      - telephony-gateway
    ports:
      - "${ASTERISK_BIND_IP:-127.0.0.1}:5060:5060/udp"
      - "${ASTERISK_BIND_IP:-127.0.0.1}:5060:5060/tcp"
      - "${ASTERISK_WEBRTC_BIND_IP:-127.0.0.1}:8088:8088/tcp"
      - "${ASTERISK_BIND_IP:-127.0.0.1}:10000-10100:10000-10100/udp"
    volumes:
      - orbita_asterisk_recordings:/var/spool/asterisk/recording
      - orbita_telephony_runtime:/var/lib/orbita/telephony-runtime
      # Optional legacy desk-phone endpoints. Browser SIP users come from the
      # database-backed runtime configuration.
      - ${ASTERISK_ENDPOINTS_FILE:-./telephony/asterisk/config/pjsip.endpoints.conf.example}:/etc/asterisk/orbita/pjsip.endpoints.conf:ro
    healthcheck:
      test: ["CMD", "/opt/orbita-asterisk/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  coturn:
    profiles: ["telephony-media"]
    image: coturn/coturn:4.17.2-r0-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      COTURN_REALM: ${COTURN_REALM:-orbitsu.ru}
      COTURN_AUTH_SECRET: ${COTURN_AUTH_SECRET:-}
      COTURN_EXTERNAL_IP: ${COTURN_EXTERNAL_IP:-}
      COTURN_RELAY_IP: ${COTURN_RELAY_IP:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${COTURN_AUTH_SECRET}" || { echo "COTURN_AUTH_SECRET is required" >&2; exit 1; }
        test -n "$${COTURN_EXTERNAL_IP}" || { echo "COTURN_EXTERNAL_IP is required" >&2; exit 1; }
        test -n "$${COTURN_RELAY_IP}" || { echo "COTURN_RELAY_IP is required" >&2; exit 1; }
        exec turnserver -n --log-file=stdout --listening-port=3478 \
          --listening-ip="$${COTURN_RELAY_IP}" --relay-ip="$${COTURN_RELAY_IP}" \
          --external-ip="$${COTURN_EXTERNAL_IP}/$${COTURN_RELAY_IP}" \
          --min-port=49160 --max-port=49200 --fingerprint \
          --use-auth-secret --static-auth-secret="$${COTURN_AUTH_SECRET}" \
          --realm="$${COTURN_REALM}" --stale-nonce=600 \
          --user-quota=12 --total-quota=200 --no-cli --no-multicast-peers \
          --unauthorized-ratelimit \
          --allowed-peer-ip="$${COTURN_RELAY_IP}" \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --no-tls --no-dtls
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 $${COTURN_RELAY_IP} >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  orbita_pg:
  orbita_logs:
  orbita_dataprotection:
  orbita_dataprotection_api:
  orbita_releases:
  orbita_diagnostics:
  orbita_telephony_queue:
  orbita_crm_call_recordings:
  orbita_crm_success_documents:
  orbita_asterisk_recordings:
  orbita_telephony_runtime:
