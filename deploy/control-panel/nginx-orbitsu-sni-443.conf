map $ssl_preread_server_name $upstream_443 {
    orbitsu.ru          orbitsu_web_backend;
    www.orbitsu.ru      orbitsu_web_backend;
    api.orbitsu.ru      orbitsu_api_backend;
    default             orbitsu_web_backend;
}
upstream orbitsu_web_backend { server 127.0.0.1:8444; }
upstream orbitsu_api_backend { server 127.0.0.1:8445; }
server {
    listen 0.0.0.0:443;
    listen [::]:443;
    ssl_preread on;
    proxy_connect_timeout 3s;
    proxy_timeout 600s;
    proxy_pass $upstream_443;
}